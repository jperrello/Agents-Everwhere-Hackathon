<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Saturn Room</title>
  <style>
    :root{--ink:#eaf1ff;--muted:#8d9ab4;--line:#263654;--panel:#111b30;--accent:#7c9cff;--hot:#ffb86b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 80% 0,#23345b 0,#0a1020 48%,#070b14 100%);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}main{width:min(1080px,calc(100% - 32px));margin:auto;padding:52px 0 70px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:30px}h1{font-size:clamp(2.3rem,7vw,5rem);letter-spacing:-.08em;line-height:.9;margin:0 0 14px}h2{font-size:1rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}p{color:var(--muted);margin:0}.eyebrow{color:var(--hot);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;margin-bottom:12px}.status{display:flex;align-items:center;gap:9px;color:var(--muted);text-align:right}.dot{width:9px;height:9px;border-radius:99px;background:var(--hot);box-shadow:0 0 14px var(--hot)}.dot.ok{background:#74e0a0;box-shadow:0 0 14px #74e0a0}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 45px #02050c55}textarea,input,select{width:100%;color:var(--ink);background:#0b1427;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;outline:none}textarea{min-height:120px;resize:vertical;margin:10px 0}input{margin-bottom:10px}select{margin-bottom:4px}button{border:0;border-radius:11px;padding:11px 15px;color:#081020;background:var(--accent);font-weight:750;cursor:pointer}button.secondary{color:var(--ink);background:#1a2947}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}.board{min-height:260px;display:grid;gap:10px;align-content:start}.item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0d172b}.meta{color:var(--muted);font-size:.78rem;display:flex;justify-content:space-between;margin-bottom:5px}.tag{color:var(--hot);text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;font-weight:800}.brief{margin-top:18px}.briefgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.brief h3{font-size:.85rem;color:var(--hot);margin:0 0 5px}.brief ul{margin:0;padding-left:19px;color:#ccd7ee}.pitch{grid-column:1/-1;font-size:1.05rem;color:#fff}@media(max-width:760px){main{padding-top:30px}header,.layout{display:block}.status{margin-top:20px;text-align:left}.panel{margin-bottom:18px}}
  </style>
</head>
<body><main><header><div><div class="eyebrow">Local collaboration layer</div><h1>Saturn Room</h1><p>One shared board for the ideas that move a room forward.</p></div><div class="status"><span class="dot" id="dot"></span><span id="status">Checking Saturn…</span></div></header><div class="layout"><section class="panel"><h2>Drop a note</h2><input id="name" placeholder="Your name" maxlength="40" /><select id="kind"><option value="idea">Idea</option><option value="question">Question</option><option value="blocker">Blocker</option></select><textarea id="text" placeholder="What should the room remember?"></textarea><div class="actions"><button id="add">Add to room</button><button class="secondary" id="discover">Find Saturn</button></div></section><section><div class="panel"><h2>Live room <span id="count"></span></h2><div class="board" id="items"><p>Nothing here yet.</p></div></div><div class="panel brief"><div class="actions" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Room brief</h2><button id="synthesize">Synthesize</button></div><div id="synthesis"><p style="margin-top:14px">Add a few notes, then turn the room into a crisp brief.</p></div></div></section></div></main><script>
const $=id=>document.querySelector(id);const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function load(){const response=await fetch('/api/room');render(await response.json())}function render(state){const saturn=state.saturn||{};$('#status').textContent=saturn.endpoint?`${saturn.status} · ${saturn.model||'model ready'}`:'Saturn not connected';$('#dot').classList.toggle('ok',Boolean(saturn.endpoint));$('#count').textContent=`· ${state.items.length}`;$('#items').innerHTML=state.items.length?state.items.slice().reverse().map(item=>`<article class="item"><div class="meta"><span class="tag">${esc(item.kind)}</span><span>${esc(item.name)}</span></div>${esc(item.text)}</article>`).join(''):'<p>Nothing here yet.</p>';if(state.synthesis)drawBrief(state.synthesis)}function drawBrief(brief){const list=values=>`<ul>${(values||[]).map(value=>`<li>${esc(value)}</li>`).join('')}</ul>`;$('#synthesis').innerHTML=`<div class="briefgrid"><div><h3>Decisions</h3>${list(brief.decisions)}</div><div><h3>Risks</h3>${list(brief.risks)}</div><div><h3>Questions</h3>${list(brief.questions)}</div><div><h3>Next actions</h3>${list(brief.actions)}</div><div class="pitch"><h3>30-second pitch</h3>${esc(brief.pitch||'')}</div></div>`}async function add(){const text=$('#text').value.trim();if(!text)return;$('#add').disabled=true;await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#name').value,kind:$('#kind').value,text})});$('#text').value='';$('#add').disabled=false;load()}async function discover(){$('#discover').disabled=true;await fetch('/api/discover',{method:'POST'});$('#discover').disabled=false;load()}async function synthesize(){$('#synthesize').disabled=true;const response=await fetch('/api/synthesize',{method:'POST'});const data=await response.json();if(data.error)$('#synthesis').innerHTML=`<p>${esc(data.error)}</p>`;$('#synthesize').disabled=false;load()}$('#add').onclick=add;$('#discover').onclick=discover;$('#synthesize').onclick=synthesize;load();setInterval(load,1800);
</script></body></html>
